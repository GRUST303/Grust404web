<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · lost in the void</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .lost{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw;position:relative;z-index:5;}
    .lost .kicker{margin:0 0 14px;color:var(--dim);font-size:11px;letter-spacing:.3em;text-transform:uppercase;}
    .lost .code{margin:0;font-weight:400;line-height:1;font-size:clamp(5rem,22vw,13rem);color:var(--ink);letter-spacing:-.02em;}
    .lost .code .r{color:var(--red);}
    .lost p{color:var(--dim);line-height:2;margin:22px 0 34px;font-size:13.5px;}
    #void{opacity:.5;}
  </style>
</head>
<body>
  <canvas id="void"></canvas>
  <canvas id="rain"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="frame-lines"></div>
  <div class="lost">
    <p class="kicker">［ signal lost in the void ］</p>
    <h1 class="code">4<span class="r">0</span>4</h1>
    <p>这一页被虚空吞掉了。<br />回到入口，重新抽出属于你的结晶。</p>
    <a class="btn" href="/Grust404web/">← back to void</a>
  </div>
  <script>
  (function(){
    var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    // 虚空 ASCII 层
    var vc=document.getElementById("void"),vx=vc.getContext("2d");
    var G="アイウエオカキクケコ01#$%&/\\<>*+=結晶虚空王之手◆◇◈✦░▒▓".split("");
    var w,h,cols,rows,cell,grid,dpr;
    function rs(){dpr=Math.min(devicePixelRatio||1,2);w=vc.width=innerWidth*dpr;h=vc.height=innerHeight*dpr;
      vc.style.width=innerWidth+"px";vc.style.height=innerHeight+"px";cell=18*dpr|0;cols=Math.ceil(w/cell);rows=Math.ceil(h/cell);
      grid=new Array(cols*rows).fill(0).map(function(){return{ch:G[Math.random()*G.length|0],a:Math.random()*.25,red:Math.random()<.02};});
      vx.font=(cell*.82|0)+'px "JetBrains Mono",monospace';vx.textBaseline="top";}
    var last=0;
    function vf(ts){if(reduce)return;if(ts-last>55){last=ts;vx.clearRect(0,0,w,h);
      var churn=cols*rows*.06;for(var i=0;i<churn;i++){var g=grid[Math.random()*grid.length|0];g.ch=G[Math.random()*G.length|0];g.a=.08+Math.random()*.55;g.red=Math.random()<.02;}
      for(i=0;i<grid.length;i++){g=grid[i];g.a*=.965;if(g.a<.03)continue;var x=(i%cols)*cell,y=(i/cols|0)*cell;
        vx.fillStyle=g.red?"rgba(255,51,85,"+g.a+")":"rgba(220,220,220,"+g.a+")";vx.fillText(g.ch,x,y);}}
      requestAnimationFrame(vf);}
    addEventListener("resize",rs);rs();requestAnimationFrame(vf);
    // 雨
    var c=document.getElementById("rain"),x=c.getContext("2d"),rw,rh,d;
    function rrs(){rw=c.width=innerWidth;rh=c.height=innerHeight;d=Array.from({length:Math.min(200,rw/6|0)},mk);}
    function mk(){return{x:Math.random()*rw,y:Math.random()*rh,l:8+Math.random()*16,s:5+Math.random()*7,a:.08+Math.random()*.28};}
    function f(){x.clearRect(0,0,rw,rh);for(var p of d){x.strokeStyle="rgba(230,230,230,"+p.a+")";x.lineWidth=.8;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-p.l*.15,p.y+p.l);x.stroke();p.y+=p.s;p.x-=p.s*.15;if(p.y>rh){p.y=-p.l;p.x=Math.random()*rw;}}requestAnimationFrame(f);}
    addEventListener("resize",rrs);rrs();if(!reduce)f();
  })();
  </script>
</body>
</html>
